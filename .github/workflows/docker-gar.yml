name: Lint, Unit Test and Push to Google Artifact Registry

on:
  push:
    branches: [main]

env:
  PROJECT_ID: portal-gb-prod
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE: wss-rewards
  REPOSITORY: wss-rewards

jobs:
  golangci-lint:
    name: Run golangci-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 10m --verbose

  gocritic:
    name: Run gocritic
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: gocritic
        run: |
          go install github.com/go-critic/go-critic/cmd/gocritic@v0.11.2
          gocritic check -disable=sloppyTypeAssert ./...

  test:
    name: Run unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.22

      - name: unit tests
        run: CGO_ENABLED=0 go test ./... -short

  test-docker-build:
    name: Test build of Docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: docker/build-push-action@v2
        with:
          build-args: |
            IMAGE_TAG=test
            GITHUB_TOKEN=${{ secrets.POKT_BOT_GITHUB_TOKEN }}
          push: false
          load: true
          tags: test-build
